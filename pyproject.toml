[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-code-review-agent"
version = "0.1.0"
description = "AI-powered Git code review agent"
requires-python = ">=3.9"
dependencies = [
    "anthropic",
    "click",
    "pydantic",
    "pytest",
]

[project.scripts]
code-review = "code_review_agent.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["code_review_agent*"]